<!DOCTYPE html><html><head>
<title>AWF Admin V2 - Images + Video</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter,sans-serif;background:#0a0a0a;color:white;padding:20px}
.card{background:#1a1a1a;padding:20px;border-radius:12px;max-width:700px;margin:auto}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#222;color:white}
button{background:#FFD700;color:black;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.item{background:#222;padding:12px;border-radius:8px;margin:10px 0}
.badge{padding:4px 10px;border-radius:20px;font-size:11px} .mall{background:green} .auction{background:red}
.small{font-size:11px;color:#888}
</style>
</head><body>
<div class="card" id="loginBox">
<h2>AWF Admin V2</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">Default: AWF2026</p>
</div>
<div class="card" id="adminBox" style="display:none">
<h2>Add Property - Images + Video</h2>
<input id="title" placeholder="Title e.g. 5 Bedroom Duplex Guzape">
<div style="display:flex;gap:10px"><input id="price" type="number" placeholder="Price NGN e.g. 650000000"><input id="beds" type="number" placeholder="Beds"></div>
<input id="city" placeholder="City e.g. Abuja Guzape">
<p class="small">IMAGES (Best: Upload to imgbb.com and paste links - 1 per line, up to 5)</p>
<textarea id="images" rows="5" placeholder="https://i.ibb.co/xxxx/image1.jpg
https://i.ibb.co/xxxx/image2.jpg
https://i.ibb.co/xxxx/image3.jpg
https://i.ibb.co/xxxx/image4.jpg"></textarea>
<p class="small">VIDEO (YouTube link OR direct MP4 link - Optional but HIGHLY recommended for billionaires)</p>
<input id="video" placeholder="YouTube: https://youtube.com/watch?v=... OR https://...mp4">
<textarea id="desc" placeholder="Description + Features: e.g. Swimming pool, BQ, C of O"></textarea>
<select id="status"><option>Available</option><option>Sold</option><option>Under Offer</option></select>
<p id="autoRule" style="color:#FFD700;font-weight:bold"></p>
<button onclick="addProperty()">ADD PROPERTY WITH GALLERY</button>

<h3 style="margin-top:30px">Listings (<span id="count">0</span>) - Tap to preview gallery</h3>
<div id="list"></div>
<button onclick="exportJSON()" style="background:white">EXPORT JSON</button>
<button onclick="if(confirm('Clear all?')){localStorage.removeItem('awf_props');location.reload()}" style="background:#333;color:white">CLEAR ALL</button>
</div>
<script>
let props=JSON.parse(localStorage.getItem('awf_props')||'[]');
function login(){if(document.getElementById('pass').value==='AWF2026'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';render();}else alert('Wrong');}
document.getElementById('price').addEventListener('input',()=>{let p=Number(document.getElementById('price').value);let r=document.getElementById('autoRule');if(p>=500000000){r.textContent='=> AUTO: AUCTION (500M+ - with Video Tour)';r.style.color='#ff4444';}else if(p>0){r.textContent='=> AUTO: MALL (Free Enquiry + Gallery)';r.style.color='#44ff44';}});
function addProperty(){
 let imgArr=document.getElementById('images').value.split('\n').map(s=>s.trim()).filter(s=>s);
 if(imgArr.length==0)return alert('Add at least 1 image link');
 let p={id:Date.now(),title:document.getElementById('title').value,price:Number(document.getElementById('price').value),city:document.getElementById('city').value,beds:document.getElementById('beds').value,images:imgArr,video:document.getElementById('video').value,desc:document.getElementById('desc').value,status:document.getElementById('status').value,type:Number(document.getElementById('price').value)>=500000000?'AUCTION':'MALL',date:new Date().toLocaleDateString()};
 if(!p.title||!p.price)return alert('Title + Price required');
 props.unshift(p);localStorage.setItem('awf_props',JSON.stringify(props));render();
 document.getElementById('title').value='';document.getElementById('price').value='';document.getElementById('images').value='';document.getElementById('video').value='';
 alert('Added '+p.images.length+' images '+(p.video?' + Video ✓':''));
}
function render(){
 document.getElementById('count').textContent=props.length;
 document.getElementById('list').innerHTML=props.map(x=>`
 <div class="item">
  <div style="display:flex;gap:8px;overflow-x:auto">${x.images.slice(0,4).map(img=>`<img src="${img}" style="width:60px;height:60px;object-fit:cover;border-radius:6px">`).join('')}</div>
  <div style="margin-top:8px"><b>${x.title}</b><br><small>${x.city} - ₦${x.price.toLocaleString()} - ${x.images.length} imgs ${x.video?' + 🎥 Video':''}</small> <span class="badge ${x.type==='MALL'?'mall':'auction'}">${x.type}</span></div>
  <div style="display:flex;gap:6px;margin-top:8px"><button onclick="del(${x.id})" style="background:red;padding:6px;font-size:11px">DELETE</button><button onclick="preview(${x.id})" style="background:#333;color:white;padding:6px;font-size:11px">PREVIEW</button></div>
 </div>`).join('');
}
function del(id){props=props.filter(x=>x.id!==id);localStorage.setItem('awf_props',JSON.stringify(props));render();}
function preview(id){let p=props.find(x=>x.id===id);alert(p.title+'\nImages:'+p.images.length+'\nVideo:'+(p.video||'none')+'\n\nOn main site, buyers will see gallery slider + video button');}
function exportJSON(){let blob=new Blob([JSON.stringify(props,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='awf-listings.json';a.click();}
</script>
</body></html>
