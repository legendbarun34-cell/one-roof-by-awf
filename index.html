<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWF OneRoof - GLOBAL HOLOGRAPHIC V4</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<style>
body{font-family:Inter,sans-serif;background:#050a14;color:white}
.holo-glow{box-shadow:0 0 25px #00ffff55;border:1px solid #00ffff80}
.live-dot{animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.swipe-container{scroll-snap-type:x mandatory}
.swipe-item{scroll-snap-align:start}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-black/85 border-b border-cyan-500/30 px-4 py-3 flex justify-between">
<div><h1 class="text-xl font-bold text-cyan-400">AWF ONE<span class="text-white">ROOF</span></h1><p class="text-[10px] text-cyan-300">GLOBAL HOLOGRAPHIC V4 UPGRADED</p></div>
<div class="flex gap-2 items-center"><span class="w-2 h-2 bg-green-400 rounded-full live-dot"></span><span class="text-[11px] text-green-400">LIVE</span><a href="admin.html" class="bg-white/10 px-3 py-1 rounded-full text-xs">Admin</a></div>
</header>

<!-- HOLOGRAPHIC WRAPPER - YOUR CODE -->
<div id="holoWrap" style="width:100%;height:480px;background:radial-gradient(ellipse at center,#0a2a2a,#000);border:1px solid #00ffff60;position:relative;overflow:hidden">
  <model-viewer id="holoViewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" auto-rotate rotation-per-second="15deg" camera-controls camera-orbit="45deg 75deg 2.5m" style="width:100%;height:100%;display:none" ar environment-image="neutral" exposure="1"></model-viewer>
  <canvas id="wireCanvas" style="width:100%;height:100%;display:block"></canvas>
  <div style="position:absolute;bottom:12px;left:12px;background:#00ffff20;border:1px solid #0ff;padding:6px 14px;font-size:11px;color:#0ff;border-radius:20px">◈ DRAG TO ROTATE 360° • SCROLL ZOOM • LIVE HOLOGRAM</div>
  <div style="position:absolute;top:12px;right:12px;background:#000c;border:1px solid #0ff;padding:6px 12px;font-size:10px;color:#0ff;border-radius:20px">WIRE: <span id="holoInfo">Auto Wireframe - 5 Floors</span> • <span id="holoTitle">AWF Building</span></div>
</div>

<section class="px-4 py-4 pb-24">
<div class="flex justify-between mb-3"><h2 class="font-bold">Global Properties <span id="count" class="text-cyan-400">0</span></h2><span class="text-[11px] text-white/50">Swipe 7 images • Tap hologram</span></div>
<div id="feed" class="space-y-4"></div>
</section>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCaT7A33x93pBgSUhBZOPbKX6egSgLqDLI",
  authDomain: "awf-oneroof.firebaseapp.com",
  projectId: "awf-oneroof",
  storageBucket: "awf-oneroof.firebasestorage.app",
  messagingSenderId: "752950974508",
  appId: "1:752950974508:web:52b693571800a0835a9989",
  measurementId: "G-T1L6D42RZX"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "properties");
const viewer=document.getElementById('holoViewer');
const wireCanvas=document.getElementById('wireCanvas');
const holoInfo=document.getElementById('holoInfo');
const holoTitle=document.getElementById('holoTitle');
let group, renderer, camera, rotY=0, auto=true, isDrag=false, prevX=0;
function initWire(){
 const scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(45, wireCanvas.clientWidth/wireCanvas.clientHeight, 0.1, 100);
 camera.position.set(0,6,12);
 renderer=new THREE.WebGLRenderer({canvas:wireCanvas, alpha:true, antialias:true});
 renderer.setSize(wireCanvas.clientWidth, wireCanvas.clientHeight);
 group=new THREE.Group(); scene.add(group);
 const geo=new THREE.BoxGeometry(3,6,3);
 const edges=new THREE.EdgesGeometry(geo);
 const mat=new THREE.LineBasicMaterial({color:0x00ffff});
 const wire=new THREE.LineSegments(edges,mat); group.add(wire);
 for(let i=0;i<5;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.05,3.3), new THREE.MeshBasicMaterial({color:0x00ffff, transparent:true, opacity:0.2})); f.position.y=-2.5+i*1.5; group.add(f);}
 wireCanvas.addEventListener('pointerdown', e=>{isDrag=true; auto=false; prevX=e.clientX;});
 wireCanvas.addEventListener('pointerup', ()=>{isDrag=false; setTimeout(()=>auto=true,2000);});
 wireCanvas.addEventListener('pointermove', e=>{if(!isDrag)return; rotY+=(e.clientX-prevX)*0.01; prevX=e.clientX;});
 function animate(){requestAnimationFrame(animate); if(auto) rotY+=0.008; if(group) group.rotation.y=rotY; renderer.render(scene,camera);} animate();
}
initWire();
window.openHolographic = function(property){
 if(property.model3d && property.holoType==='glb' && property.model3d!=''){
   viewer.style.display='block'; wireCanvas.style.display='none'; viewer.src=property.model3d; viewer.style.filter='hue-rotate(180deg) brightness(1.4) drop-shadow(0 0 25px #0ff)'; holoInfo.innerText='GLB Model';
 }else{
   viewer.style.display='none'; wireCanvas.style.display='block'; holoInfo.innerText='Auto Wireframe - 5 Floors';
 }
 holoTitle.innerText=property.title||'AWF Building';
 document.getElementById('holoWrap').scrollIntoView({behavior:'smooth'});
}
const feed=document.getElementById('feed');
const q=query(colRef, orderBy('createdAt','desc'));
onSnapshot(q, snap=>{
 feed.innerHTML=''; document.getElementById('count').textContent=snap.size;
 if(snap.empty){feed.innerHTML='<div class="text-center py-16 border border-dashed border-cyan-500/20 rounded-[20px]">No properties yet - Go to Admin</div>'; return;}
 snap.forEach(d=>{
   const p=d.data(); const imgs=(p.images||[]).slice(0,7);
   const div=document.createElement('div');
   div.className='bg-[#0d1b33] border border-white/10 rounded-[20px] overflow-hidden';
   div.innerHTML=`<div class="relative"><div class="flex overflow-x-auto swipe-container">${imgs.map(u=>`<div class="min-w-full h-64 bg-black"><img src="${u}" class="w-full h-64 object-cover"></div>`).join('')}</div><div class="absolute top-3 left-3 bg-black/70 px-2 py-1 rounded-full text-[10px]">${imgs.length}/7 SWIPE</div><div class="absolute top-3 right-3 bg-cyan-500 text-black px-3 py-1 rounded-full text-[11px] font-black">₦${Number(p.price||0).toLocaleString()}</div><div class="absolute bottom-3 right-3 flex gap-2">${p.video?`<a href="${p.video}" target="_blank" class="bg-red-500 text-white px-3 py-1 rounded-full text-[10px]">VIDEO</a>`:''}<button onclick='openHolographic({title:"${(p.title||'').replace(/"/g,'')}",model3d:"${(p.model3d||'').replace(/"/g,'')}",holoType:"${p.holoType||'wireframe}"})' class="bg-[#0ff] text-black px-3 py-1 rounded-full text-[10px] font-black">HOLOGRAM</button></div></div><div class="p-4"><h3 class="font-bold">${p.title||''}</h3><p class="text-[12px] text-white/60">${p.city||''} • ${p.desc||''}</p></div>`;
   feed.appendChild(div);
 });
});
</script>
</body>
</html>
